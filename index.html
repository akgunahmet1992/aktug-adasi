<style>
  :root {
    --guvenli-ust: env(safe-area-inset-top, 0px);
    --guvenli-alt: env(safe-area-inset-bottom, 0px);
    --guvenli-sol: env(safe-area-inset-left, 0px);
    --guvenli-sag: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d1b2a;
    color: #e8eef5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Mobilde kaydirma/yenileme jestleri oyunu kesiyordu. */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #oyun-kabi { position: fixed; inset: 0; }
  #oyun-kabi canvas { display: block; width: 100%; height: 100%; }

  /* Arayuz katmani: DOM overlay. Canvas'a degil buraya cizilir --
     metin keskin kalsin ve responsive olsun diye. */
  #arayuz-kabi {
    position: fixed; inset: 0;
    pointer-events: none;   /* alt katmanlar kendi pointer-events'ini acar */
    z-index: 10;
  }

  /* Acilis perdesi. Ilk kare cizilene kadar duruyor; main.js kaldiriyor. */
  #perde {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: radial-gradient(120% 90% at 50% 20%, #1b3a5c 0%, #0d1b2a 60%, #060d16 100%);
    transition: opacity .5s ease;
  }
  #perde.gizli { opacity: 0; pointer-events: none; }

  #perde h1 {
    margin: 0; font-size: clamp(22px, 5vw, 40px);
    font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(180deg, #ffe9a8, #ffb547);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #perde p { margin: 0; opacity: .7; font-size: 14px; }

  #yukleme-cubugu {
    width: min(260px, 60vw); height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.12); overflow: hidden;
  }
  #yukleme-dolgu {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ffb547, #ffe9a8);
    transition: width .25s ease;
  }

  /* Dikey tutuldugunda uyari. Oyun yatay tasarlandi. */
  #yatay-uyari { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #yatay-uyari {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0d1b2a; text-align: center; padding: 24px;
    }
    #yatay-uyari .telefon {
      width: 54px; height: 92px; border: 3px solid #ffb547; border-radius: 10px;
      animation: cevir 1.8s ease-in-out infinite;
    }
    @keyframes cevir {
      0%, 30% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
  }
</style>
  <script type="module" crossorigin src="./assets/index-A6rdFzeI.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/motor-Dkg9D8x5.js">
</head>
<body>
  <div id="oyun-kabi"></div>
  <div id="arayuz-kabi"></div>

  <div id="perde">
    <h1>AKTUĞ ve DÜŞEN YILDIZLAR</h1>
    <div id="yukleme-cubugu"><div id="yukleme-dolgu"></div></div>
    <p id="yukleme-yazi">yükleniyor…</p>
  </div>

  <div id="yatay-uyari">
    <div class="telefon"></div>
    <div>Telefonu <b>yan çevir</b></div>
  </div>

</body>
</html>
